<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email preferences – getpcnow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
 body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#f4f6f8;font-family:"DM Sans",Arial,sans-serif;color:#1a1a1a}
 .top{width:100%;padding:18px 24px;background:#fff;border-bottom:1px solid #e3e7eb;box-sizing:border-box}
 .logo{font-family:Manrope,Arial,sans-serif;font-weight:800;font-size:22px;color:#111;text-decoration:none}
 .logo b{color:#1e90ff}
 .card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.07);margin:48px 16px;padding:36px 32px;max-width:440px;width:100%;box-sizing:border-box;text-align:center}
 .ic{width:56px;height:56px;border-radius:50%;background:#e7f7ec;color:#1a9b4a;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
 .ic.bad{background:#fdeaea;color:#c0392b}
 h1{font-size:22px;margin:0 0 10px}
 p{color:#555;line-height:1.5;margin:0 0 22px}
 a.btn{display:inline-block;background:#1e90ff;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:8px}
</style>
</head>
<body>
<div class="top"><a class="logo" href="./">get<b>pc</b>now</a></div>
<div class="card">
 <div class="ic" id="ic">✓</div>
 <h1 id="h">You are unsubscribed</h1>
 <p id="m">You will not get any more price alert emails from getpcnow. Emails already on their way may still arrive.</p>
 <a class="btn" href="./">Back to getpcnow</a>
</div>
<script>
 var s=new URLSearchParams(location.search).get("status");
 if(s==="invalid"||s==="error"){
  document.getElementById("ic").textContent="!";document.getElementById("ic").className="ic bad";
  document.getElementById("h").textContent=s==="invalid"?"This link is not valid":"Something went wrong";
  document.getElementById("m").textContent=s==="invalid"?"The unsubscribe link may be old or incomplete. Use the link in your most recent getpcnow email.":"Please try the link again in a minute."}
</script>
</body>
</html>
