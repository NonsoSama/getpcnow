<script>
/* mobile menu: the hamburger button shows or hides the nav links (see the max-width:760px block in dark.css) */
(function(){
  var h=document.querySelector("header"),b=document.getElementById("menuBtn");
  if(!h||!b)return;
  function set(o){h.classList.toggle("menu-open",o);b.setAttribute("aria-expanded",o?"true":"false");b.setAttribute("aria-label",o?"Close menu":"Open menu")}
  b.addEventListener("click",function(){set(!h.classList.contains("menu-open"))});
  document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("#mainnav a"))set(false)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")set(false)});
  window.matchMedia("(min-width:761px)").addEventListener("change",function(e){if(e.matches)set(false)});
})();
</script>
<script>
/* back-to-top button (#top is built by app.js): show it after the first bit of scrolling */
(function(){
  var busy=false;
  function upd(){busy=false;var b=document.getElementById("top");if(b)b.classList.toggle("show",(window.pageYOffset||document.documentElement.scrollTop)>200)}
  window.addEventListener("scroll",function(){if(!busy){busy=true;requestAnimationFrame(upd)}},{passive:true});
  upd();
})();
</script>
