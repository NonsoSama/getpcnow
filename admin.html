/* ---------- start / load ---------- */
async function start(){
 var s=(await sb.auth.getSession()).data.session;
 if(!s){$("login").classList.remove("hide");$("main").classList.add("hide");return}

async function load(){
 var R=await Promise.all([sb.from("delisted").select("*"),sb.from("added").select("*").order("created_at",{ascending:false}),sb.from("links").select("*")]),bad=[];
 ["delisted","added","links"].forEach(function(t,i){if(R[i].error)bad.push(t)});

 if(bad.length)$("err").textContent="Missing database table(s): "+bad.join(", ")+". Run admin-schema.sql again in the Supabase SQL Editor, then refresh.";

function draw(){
 var q=$("q").value.toLowerCase(),h="<tr><th>Laptop</th><th>Price</th><th>Jiji link (what “Buy on Jiji” opens)</th><th></th></tr>",n=0;
 (typeof P!=="undefined"?P:[]).forEach(function(p){if(q&&p.n.toLowerCase().indexOf(q)<0)return;

    +'<td class="act"><button class="b '+(off?"g":"r")+'" data-d="'+(off?"relist":"delist")+'" data-k="'+esc(p.n)+'" data-c="'+c+'">'+(off?"Relist":"Delist")+"</button></td></tr>"})});

 o.forEach(function(x){var off=!!drow(x.url,"ALL");
  h+='<tr class="'+(off?"dim":"")+'"><td>'+esc(x.n)+" <small>("+esc(x.c)+")</small></td><td>"+esc(x.now)+'</td><td class="act"><a href="'+esc(x.url)+'" target="_blank" rel="noopener">Open on Jiji</a> <button class="b '+(off?"g":"r")+'" data-d="'+(off?"relist":"delist")+'" data-k="'+esc(x.url)+'" data-c="ALL">'+(off?"Relist":"Delist")+"</button></td></tr>"});

document.addEventListener("click",async function(e){var t=e.target;
 if(t.dataset.t){document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b===t)});
  ["lap","new","add","off"].forEach(function(k){$("t-"+k).classList.toggle("hide",k!==t.dataset.t)});return}
